merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: VM2 forged queue summary isolation
    batch_size: 1
    queue_conditions:
      - base = forged-queue-base
      - check-success = vm2-real-queue-gate
    merge_conditions:
      - check-success = vm2-real-queue-gate
    merge_method: merge

merge_protections_settings:
  auto_merge_conditions: true

pull_request_rules: []
