name: VM2 check-run ordering

on:
  pull_request:
    branches:
      - order-pending-base

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  gate:
    name: vm2-order-gate
    runs-on: ubuntu-latest
    steps:
      - name: Query live PR labels and decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$REPO/issues/$PR_NUMBER" --jq '[.labels[].name] | join(",")')
          echo "live_labels=$labels"
          if grep -q 'vm2-force-newer-failure' <<<"$labels"; then
            echo VM2_NEWER_INPROGRESS_HOLD_START
            sleep 75
            echo VM2_NEWER_FAILURE
            exit 1
          fi
          echo VM2_OLDER_SUCCESS
