name: VM2 forged queue check control

on:
  pull_request:
    branches:
      - forged-queue-base

permissions:
  contents: read

jobs:
  real-gate:
    name: vm2-real-queue-gate
    runs-on: ubuntu-latest
    steps:
      - name: Pass source PR but fail Mergify speculative PR
        shell: bash
        run: |
          set -euo pipefail
          echo "head_ref=${{ github.head_ref }}"
          if [[ "${{ github.head_ref }}" == mergify/merge-queue/* ]]; then
            echo VM2_REAL_QUEUE_GATE_SYNTHETIC_FAILURE
            exit 1
          fi
          echo VM2_REAL_QUEUE_GATE_SOURCE_SUCCESS

  foreign-queue-summary:
    name: Mergify Merge Queue
    runs-on: ubuntu-latest
    steps:
      - name: Foreign same-name success
        run: echo VM2_FOREIGN_QUEUE_SUMMARY_SUCCESS
