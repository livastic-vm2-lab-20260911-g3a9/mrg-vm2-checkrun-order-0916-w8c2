name: VM2 midflight protection checks
on:
  pull_request:
    branches: [harden-base]
permissions:
  contents: read
jobs:
  hold:
    name: vm2-midflight-hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - shell: bash
        run: |
          set -euo pipefail
          echo "head_ref=${{ github.head_ref }}"
          if [[ "${{ github.head_ref }}" == mergify/merge-queue/* ]]; then sleep 75; fi
  native-security:
    name: vm2-new-native-security
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
